/* ---------- neve que vai branqueando o corpo (aos poucos; pular na neve deixa tudo branco) ---------- */
let SNOWLVL=0;
const SNOWC=new WeakMap();
function snowTint(img,lv){
  if(!lv||!img||!img.getContext||!img.width)return img;
  const q=Math.min(6,Math.round(lv*6));if(!q)return img;
  let m=SNOWC.get(img);if(!m){m={};SNOWC.set(img,m);}
  if(m[q])return m[q];
  const w=img.width,h=img.height,[c,x]=mk(w,h);x.drawImage(img,0,0);
  let d;try{d=x.getImageData(0,0,w,h);}catch(e){d=null;}
  if(!d||!d.data){m[q]=img;return img;}
  const a=d.data,list=[];
  for(let i=0;i<w*h;i++){
    const r=a[i*4],g=a[i*4+1],b=a[i*4+2],al=a[i*4+3];if(al<200)continue;
    if(r>140&&g>100&&b>50&&b<175&&r-b>40&&g>r*0.62){const px=i%w,py=(i/w)|0;list.push([i,hash(px*3.1,py*1.7)*0.55+(1-px/w)*0.25+(py/h)*0.2]);}
  }
  list.sort((u,v)=>u[1]-v[1]);
  const n=Math.floor(list.length*q/6);
  for(let k=0;k<n;k++){const i=list[k][0],sh=(a[i*4]+a[i*4+1])<330?0.93:1;a[i*4]=(244*sh)|0;a[i*4+1]=(247*sh)|0;a[i*4+2]=(252*sh)|0;}
  x.putImageData(d,0,0);m[q]=c;return c;
}
const TRACKS=[];
function jumpIntoSnow(){
  P.snow=1;burst(P.x,P.y,24,['#ffffff','#dfe9f4','#bcd0e4'],3,0.05,42,2);sfx('snowland');G.shake=Math.max(G.shake,3);
  ftext(P.x,P.y-30,'AFUNDOU NA NEVE!','#dfe9f4');
}

/* ---------- temperatura: -20 congela e mata; fogueiras e munição de fogo esquentam ---------- */
const TEMP_MIN=-20,TEMP_MAX=5;
function warmthNear(){
  let w=0;
  for(const s of ST){
    if(s.t==='fire'){const d=Math.hypot(P.x-s.x,P.y-s.y);if(d<82)w=Math.max(w,0.05*(1-d/110));}
    else if(s.t==='lamp'){if(Math.abs(P.x-s.x)<36)w=Math.max(w,0.012);}
  }
  if(R.warm)w=Math.max(w,0.08);
  return w;
}
function iceHit(){
  if(P.dead||P.dashT>0||P.hidden)return;
  P.iceT=120;G.flags.temp=Math.max(TEMP_MIN,(G.flags.temp||0)-3);P.snow=Math.min(1,(P.snow||0)+0.2);
  sfx('ice');burst(P.x,P.y-10,12,['#bfefff','#ffffff','#6ad0ff'],2.2,0.02,26,2);G.iceFlash=10;
}
function updateWinter(){
  const f=G.flags;if(f.temp===undefined)f.temp=0;
  if(P.iceT>0)P.iceT--;if(G.iceFlash>0)G.iceFlash--;
  if(R&&R.snowy){
    if(!P.onGround)P.air=(P.air||0)+1;else{if(P.air>9&&!P.dead)jumpIntoSnow();P.air=0;}
  }else P.air=0;
  P.slowMul=1;
  if(!R||P.dead||G.cine){return;}
  /* neve no corpo e nos inimigos */
  if(R.snowy&&R.cold){
    P.snow=Math.min(1,(P.snow||0)+0.00026+(Math.abs(P.vx)>0.4?0.0002:0));
    for(const e of EN)if(!e.ally&&!e.dead)e.snow=Math.min(0.85,(e.snow||0)+0.0004);
  }else if(P.snow>0)P.snow=Math.max(0,P.snow-0.0006);
  const w=warmthNear();
  if(w>0.02&&P.snow>0)P.snow=Math.max(0,P.snow-0.006);
  /* rastros e fofura da neve */
  if(R.snowy){
    if(P.onGround&&Math.abs(P.vx)>0.4){
      if(G.t%6===0)PART.push({x:P.x-P.face*4,y:P.y,vx:rnd(-0.4,0.4),vy:rnd(-0.7,-0.2),life:18,max:18,col:'#f4f8fc',sz:2,grav:0.02});
      const lt=TRACKS[TRACKS.length-1];
      if(!lt||Math.abs(lt.x-P.x)>6||lt.room!==R.id){TRACKS.push({x:P.x,y:P.y,age:0,f:P.face,room:R.id});if(TRACKS.length>140)TRACKS.shift();}
    }
    for(const s of ST)if(s.t==='drift'&&Math.abs(P.x-s.x)<26&&P.onGround){P.slowMul*=0.8;if(G.t%3===0)PART.push({x:P.x+rnd(-6,6),y:P.y-rnd(0,8),vx:rnd(-0.6,0.6),vy:rnd(-1,-0.2),life:22,max:22,col:'#ffffff',sz:2,grav:0.03});P.snow=Math.min(1,(P.snow||0)+0.002);}
  }
  for(const t of TRACKS)t.age++;
  while(TRACKS.length&&TRACKS[0].age>520)TRACKS.shift();
  /* frio */
  if(!R.cold){f.temp=Math.min(0,f.temp+0.01);P.slowMul*=P.iceT>0?0.55:1;return;}
  const rate=R.cold===2?0.0105:0.0075;
  f.temp+=(w>0.02?w:(w-rate));
  for(const b of BUL)if(b.own==='p'&&b.kind==='fire'&&!b.warmed){b.warmed=true;f.temp+=5;ftext(P.x,P.y-30,'+5°','#ffb347');}
  f.temp=clamp(f.temp,TEMP_MIN,TEMP_MAX);
  const cold=Math.max(0,-f.temp-8);
  P.slowMul*=(1-Math.min(0.3,cold/40))*(P.iceT>0?0.55:1);
  if(f.temp<=TEMP_MIN&&!P.dead){G.frozenDeath=true;banner('CONGELOU!','O frio foi mais forte que o xerife.',200,'#9fe8ff');die();}
}
function drawTracks(){
  for(const t of TRACKS){
    if(t.room!==R.id)continue;
    const a=Math.max(0,1-t.age/520)*0.7;if(a<=0.02)continue;
    ctx.globalAlpha=a;rc(ctx,'#93a6bf',Math.round(t.x)-2,Math.round(t.y)-1,5,1);rc(ctx,'#c9d8ea',Math.round(t.x)-2,Math.round(t.y),5,1);
  }
  ctx.globalAlpha=1;
}
function drawTempHUD(){

  const f=G.flags,t=f.temp||0,bw=92,bx=W-bw-12,by=10,fr=clamp((t-TEMP_MIN)/(TEMP_MAX-TEMP_MIN),0,1);

  txt(Math.round(t)+'°',bx-26,by-1,t<-15&&Math.floor(G.t/10)%2?'#ff6a5a':'#e8f4ff',8);
  if(t<-14)txt('CONGELANDO!',bx+bw/2,by+12,Math.floor(G.t/8)%2?'#ff6a5a':'#9fe8ff',8,'center');

function drawColdOverlay(){

/* atirador esperto: mira à frente, desvia dos seus tiros, anda de lado, se separa dos amigos e recua quando está ferido */
AI.frostgun=function(e){
  e.vy=Math.min(e.vy+0.32,7);e.tm++;if(e.cd>0)e.cd--;if(e.dodge>0)e.dodge--;if(e.kick>0)e.kick--;if(e.warn>0)e.warn--;
  if(!e.maxhp)e.maxhp=e.hp;
  const dx=P.x-e.x,ad=Math.abs(dx),dy=P.y-e.y;
  const near=!P.dead&&ad<320&&Math.abs(dy)<90;
  if(!near){walkerMove(e,0.5);e.face=e.dir;bodyMove(e,false);return;}
  e.face=dx>=0?1:-1;
  if(!(e.dodge>0)&&e.onGround){
    for(const b of BUL){if(b.own!=='p'||b.dead)continue;const rel=e.x-b.x;
      if(Math.abs(b.y-(e.y-10))<18&&Math.abs(rel)<70&&Math.sign(rel)===Math.sign(b.vx)){e.vy=-5.4;e.dodge=55;break;}}
  }
  if(e.side===undefined)e.side=Math.random()<0.5?-1:1;
  if(e.tm%60===0){const fr=EN.find(o=>o!==e&&!o.dead&&(o.t==='frostgun'||o.t==='frostdyn')&&Math.abs(o.x-e.x)<70);if(fr)e.side=-(Math.sign(fr.x-e.x)||1);e.str=rint(-1,1);}
  const low=e.hp<=e.maxhp*0.4;
  let want=0;
  if(low)want=-e.face;else if(ad>170)want=e.face;else if(ad<85)want=-e.face;else want=(e.str||0)*e.side;
  e.vx=want*(low?1.3:0.95);
  if(e.onGround&&e.vx&&!groundAt(e.x+Math.sign(e.vx)*10,e.y))e.vx=0;
  if(!(e.cd>0)&&ad<235&&clearLine(e.x,e.y-10,P.x,P.y-10)&&!(e.burst>0)){e.burst=3;e.bt=0;e.cd=rint(85,120);e.warn=18;}
  if(e.burst>0){
    e.bt++;
    if(e.bt===18||e.bt===27||e.bt===36){
      const t=ad/2.8,lx=P.x+P.vx*t*0.8,ly=P.y-10+(P.onGround?0:P.vy*t*0.25);
      const gx=e.x+e.face*10,gy=e.y-9,a=Math.atan2(ly-gy,lx-gx);
      bulletE(gx,gy,a,2.8,{r:2.5,col:'#9fe8ff',ice:true,life:80});e.kick=3;sfx('efire');burst(gx,gy,4,['#bfefff','#ffffff'],1.4,0,10,2);
      e.burst--;
    }
    if(e.bt>40)e.burst=0;
  }
  bodyMove(e,false);
};
AI.frostdyn=function(e){
  e.vy=Math.min(e.vy+0.32,7);e.tm++;if(e.cd>0)e.cd--;if(e.dodge>0)e.dodge--;
  const dx=P.x-e.x,ad=Math.abs(dx),dy=P.y-e.y;
  const near=!P.dead&&ad<330&&Math.abs(dy)<100;
  if(!near){walkerMove(e,0.5);e.face=e.dir;bodyMove(e,false);return;}
  e.face=dx>=0?1:-1;
  if(e.st==='throw'){

/* labirinto: cada plataforma de um andar se apoia em outra do andar de baixo (sempre dá para subir),
   mas há becos sem saída, andares que se repetem e poços (portas) que levam a outras galerias */
const MZ_LV=3;
function mazeLayout(w,h,seed){
  const R2=rr(seed),segs=[],floor=h-3;
  let prev=[{x:0,w:w,row:floor}];
  for(let row=floor-MZ_LV;row>=6;row-=MZ_LV){
    const cur=[],n=R2.i(4,6);
    for(let k=0;k<n;k++){
      const low=R2.p(prev),sw=R2.i(4,9);
      let x=low.x+R2.i(-sw+2,low.w-2);x=clamp(x,2,w-sw-2);
      if(cur.some(s=>x<s.x+s.w+2&&x+sw>s.x-2))continue;
      cur.push({x,w:sw,row,low});
    }
    if(!cur.length){const low=prev[0],sw=6,x=clamp(low.x+2,2,w-sw-2);cur.push({x,w:sw,row,low});}
    cur.forEach(s=>segs.push(s));prev=cur;
  }
  return segs;
}
function mazeRoom(id,seed,doors,foes){
  const w=100,h=48,r=room(id,w,h,'mine',null);fl(r,0,w);deep(r);r.cold=0;
  const segs=mazeLayout(w,h,seed);
  segs.forEach(s=>plat(r,s.x,s.row,s.w));
  r.segs=segs;
  /* poços: portas que levam a outras galerias */
  const R2=rr(seed+7);
  doors.forEach((d,i)=>{
    const cand=segs.filter(s=>s.w>=5),s=cand[(R2.i(0,cand.length-1)+i*3)%cand.length]||segs[0];
    st(r,'door',s.x+(s.w>>1),{row:s.row,to:d.to,sx:d.sx,sy:d.sy,label:d.label,mine:true});
  });
  st(r,'fire',3);
  const R3=rr(seed+13);
  segs.forEach((s,i)=>{
    if(i%2===0)en(r,R3.p(foes),s.x+(s.w>>1),s.row,{rng:20});
  });
  r.decor=c=>{
    const g=FL(r)*T,R4=rr(seed+21);
    for(let x=6;x<w;x+=R4.i(8,14)){rc(c,'#3b2514',x*T,0,6,g);rc(c,'#5b3a1a',x*T+1,0,2,g);}
    segs.forEach(s=>{
      for(let x=s.x+1;x<s.x+s.w-1;x+=5){rc(c,'#3b2514',x*T+4,s.row*T-26,4,26);rc(c,'#241509',x*T+3,s.row*T-28,6,3);}
      if(R4.c(0.85))dLamp(c,(s.x+(s.w>>1))*T+8,s.row*T,'#ffb347',54);
    });
  };
  return r;
}

function briggsPick(e){
  const list=e.ph===1?['g_toss','g_fan','g_cluster','g_dash','g_slam','g_leap','g_toss']:['h_rain','h_toss3','h_dash','h_cluster','h_slam','h_leap','h_toss3'];

/* Briggs percorre a arena inteira: anda, recua, desvia de lado enquanto atira e dá saltos longos */
AI.briggs=function(e){
  e.tm++;if(e.kick>0)e.kick--;if(!e.ph)e.ph=1;if(e.warn>0)e.warn--;
  const g0=FL(R)*T,dx=P.x-e.x,p2=e.ph>=2;
  if(e.st!=='dead'&&e.st!=='wait'&&e.st!=='intro'&&e.st!=='rise')e.face=dx>=0?1:-1;
  const xmin=40,xmax=R.w*T-40,spdW=p2?2.2:1.6,gap=p2?36:56;
  const strafe=k=>{if(e.sd===undefined)e.sd=1;e.x=clamp(e.x+e.sd*k,xmin,xmax);if(e.x<=xmin+2||e.x>=xmax-2)e.sd*=-1;};
  const done=t=>{if(e.tm>t){e.st='idle';e.tm=0;}};
  switch(e.st){
    case 'wait':case 'intro':break;
    case 'rise':
      e.jy=Math.max(0,e.jy-0.4);
      if(e.tm===60){e.inv=false;e.st='idle';e.tm=0;e.jy=0;}
      break;
    case 'idle':{
      if(e.tx===undefined||Math.abs(e.x-e.tx)<8||e.tm%150===0){
        let tx=0,tries=0;do{tx=rnd(xmin,xmax);tries++;}while((Math.abs(tx-P.x)<90||Math.abs(tx-P.x)>300)&&tries<14);e.tx=tx;
      }
      e.x=clamp(e.x+Math.sign(e.tx-e.x)*spdW,xmin,xmax);
      if(e.tm>gap)briggsPick(e);
      break;}
    case 'g_toss':
      strafe(1.2);if(e.tm===14||e.tm===32||e.tm===50)briggsToss(e,1,0,0);done(78);break;
    case 'g_fan':
      strafe(0.9);if(e.tm===22||e.tm===52)briggsToss(e,7,0.8,0);done(80);break;
    case 'g_cluster':
      if(e.tm===1)e.warn=24;strafe(0.7);if(e.tm===24||e.tm===58)briggsToss(e,1,0,0,true);done(86);break;
    case 'g_dash':case 'h_dash':{
      const lead=p2?20:28;
      if(e.tm<lead){if(e.tm%5===0)puff(e.x,e.y);if(e.tm===1)e.dd=e.face;}
      else if(e.tm<lead+24){e.x=clamp(e.x+e.dd*(p2?7:5.6),xmin,xmax);if(e.tm%3===0)puff(e.x-e.dd*14,e.y);}
      else if(e.tm===lead+24){briggsToss(e,p2?5:3,0.7,0);}
      done(lead+36);break;}
    case 'g_slam':case 'h_slam':
      if(e.tm<=38){e.jy=Math.sin(e.tm/38*Math.PI)*64;e.x=clamp(e.x+(e.tm<26?Math.sign(dx)*2:0),xmin,xmax);}
      else{
        e.jy=0;
        if(e.tm===39){G.shake=14;sfx('boom');puff(e.x,e.y);for(let i=0;i<(p2?6:4);i++)briggsDrop(e,(i%2?1:-1)*(1.3+i*0.5),-3.4,30);}
        done(72);
      }
      break;
    case 'g_leap':case 'h_leap':
      if(e.tm===1){e.lx0=e.x;const side=P.x<R.w*T/2?1:-1;e.lx1=clamp(P.x+side*rnd(150,280),xmin,xmax);e.warn=14;}
      if(e.tm>14&&e.tm<=64){
        const k=(e.tm-14)/50;e.x=e.lx0+(e.lx1-e.lx0)*k;e.jy=Math.sin(k*Math.PI)*96;
        if(e.tm===30||e.tm===46||(p2&&e.tm===38))briggsDrop(e,e.face*1.2,0.4,32);
      }else if(e.tm>64){
        e.jy=0;if(e.tm===65){G.shake=12;sfx('boom');puff(e.x,e.y);briggsToss(e,p2?3:1,0.9,0);}
      }
      done(88);break;
    case 'h_rain':
      if(e.tm===1)e.warn=26;strafe(0.8);
      if(e.tm>=26&&(e.tm-26)%8===0&&(e.tm-26)/8<10){
        const k=(e.tm-26)/8,tx=clamp(P.x+(k-4.5)*30,30,R.w*T-30);
        const s=mkEn({t:'gren',x:tx,y:g0-170,vx:0,vy:0.6,er:34});s.fuse=70;s.dm=2;EN.push(s);sfx('dash');
      }
      done(130);break;
    case 'h_toss3':
      strafe(1.4);if(e.tm===14||e.tm===28||e.tm===42||e.tm===56)briggsToss(e,2,1.2,0);done(92);break;
    case 'h_cluster':
      if(e.tm===1)e.warn=20;strafe(1);if(e.tm===20||e.tm===46||e.tm===72)briggsToss(e,1,0,0,true);done(100);break;
    case 'dead':case 'fallen':e.vx=0;break;
  }
  e.y=g0-(e.jy||0);
};

const SKC={};
function recolorGun(img,kind){
  const w=img.width,h=img.height,[c,x]=mk(w,h);x.drawImage(img,0,0);
  let d;try{d=x.getImageData(0,0,w,h);}catch(e){return img;}
  if(!d||!d.data)return img;
  const a=d.data;
  for(let i=0;i<w*h;i++){
    const r=a[i*4],g=a[i*4+1],b=a[i*4+2],al=a[i*4+3];if(al<40)continue;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),L=(r+g+b)/3,sat=mx?(mx-mn)/mx:0;
    if(sat>0.26||L<34)continue;
    let nr,ng,nb;
    if(kind==='gold'){const t=clamp((L-40)/190,0,1);nr=90+t*160;ng=58+t*150;nb=10+t*100;}
    else if(kind==='black'){const t=clamp(L/255,0,1);nr=18+t*70;ng=18+t*72;nb=24+t*84;}
    else{const t=clamp(L/255,0,1);nr=150+t*100;ng=152+t*100;nb=160+t*95;}
    a[i*4]=nr;a[i*4+1]=ng;a[i*4+2]=nb;
  }
  x.putImageData(d,0,0);return c;
}
function gunBase(id){return id==='tommy'?GUN.tommy.img:id==='sniper'?S.sniperSmall:(id==='sg'?GUN.sg.img:(id==='dbl'?GUN.dbl.img:(id==='gold'?GUN.gold.img:GUN.rev.img)));}

}

/* ---------- composição das ondas ---------- */
const BK_COST={bandit:1,dyn:2,miner:1,weed:1,vult:2,bat:2,armored:4,rdyn:2,gunman:3,raider:2,frostgun:3,frostdyn:3,icearm:5};
const BK_BOSSES=[['boss','BILLY REEVES'],['gghost','FANTASMA GIGANTE'],['baron','BARÃO DA FARINHA'],['briggs','BARÃO BRIGGS FARINHA']];
function bankPool(n){
  const p=['bandit','dyn','miner'];
  if(n>=2)p.push('weed');if(n>=3)p.push('vult','bat');if(n>=4)p.push('armored','rdyn');
  if(n>=6)p.push('gunman','raider');if(n>=9)p.push('frostgun','frostdyn','icearm');
  return p;
}
function bankWaveList(n){
  const pool=bankPool(n),list=[];let budget=5+Math.floor(n*3.2);
  while(budget>0){const t=pick(pool),c=BK_COST[t]||1;if(c>budget&&list.length)break;budget-=c;list.push(t);}
  const th=Math.min(1+Math.floor((n-1)/2),6);
  for(let i=0;i<th;i++)list.splice(rint(0,list.length),0,'thief');
  return list;
}
function bankSpawn(t,side){
  const x=side<0?20:R.w*T-20,flying=t==='vult'||t==='bat';
  const y=flying?(t==='bat'?3*T:FL(R)*T-120):FL(R)*T;
  const e=mkEn({t,x,y});e.bankE=true;e.face=-side;e.home=x;e.rng=60;
  if(t==='bat'){e.st='fly';}
  EN.push(e);burst(x,y-10,8,['#ffffff','#c8b48a'],1.6,0.02,14,2);return e;
}
function bankSpawnBoss(n){
  const k=Math.floor(n/5)-1,def=BK_BOSSES[k%BK_BOSSES.length],loop=Math.floor(k/BK_BOSSES.length),t=def[0];
  const x=R.w*T-5*T,b=mkEn({t,x,y:FL(R)*T});
  b.bankE=true;b.bankBoss=true;b.bname=def[1];b.st='idle';b.ph=1;b.face=-1;b.tm=0;
  const mul=1+loop*0.6;b.max=Math.round(b.max*mul);b.hp=b.max;
  if(t==='briggs'){b.bars=2;b.risen=false;}
  EN.push(b);G.boss=b;G.bossFight=true;
  banner('CHEFE: '+def[1],'Onda '+n+'!',200,'#ff8a2a');sfx('ready');return b;
}

function bankAlive(){return EN.filter(e=>e.bankE&&!e.dead&&e.st!=='dead').length;}
function startBankWave(){
  const B=G.bank;B.wave++;B.phase='fight';B.t=0;B.q=[];B.bossDown=false;
  P.ammo=fullAmmo();G.flags.inv.pierce=99;G.flags.inv.fire=99;
  const n=B.wave;
  if(n%5===0){bankSpawnBoss(n);const m=bankWaveList(Math.max(1,n-4)).slice(0,6);m.forEach(t=>B.q.push(t));}

function bankGameOver(why){
  const B=G.bank;if(!B||B.over)return;
  B.over=true;B.why=why||'Você caiu!';bankSaveBest(Math.max(0,B.wave-1));G.state='bankover';G.bossFight=false;G.boss=null;

}
const AGGRO=['bandit','dyn','miner','gunman','armored','rdyn','raider','frostgun','frostdyn','icearm'];
function updateBank(){
  const B=G.bank;if(!B||!R||R.id!=='banco'||G.state!=='play'||B.over)return;
  if(P.dead&&G.deadT>80){bankGameOver();return;}
  B.t++;B.robbing=B.robT>0;if(B.robT>0)B.robT--;
  if(B.vault<=0){bankGameOver('O cofre foi arrombado!');return;}
  if(B.t%24===0)for(const e of EN)if(e.bankE&&AGGRO.indexOf(e.t)>=0&&!e.dead){e.home=P.x;e.rng=34;}
  if(B.phase==='prep'){
    if(B.t>150)startBankWave();
  }else if(B.phase==='fight'){
    if(B.q.length&&--B.spawnT<=0){
      const maxAlive=8+Math.min(6,Math.floor(B.wave/3));
      if(bankAlive()<maxAlive){const t=B.q.shift();bankSpawn(t,Math.random()<0.5?-1:1);B.spawnT=rint(34,70);}else B.spawnT=20;
    }
    if(!B.q.length&&bankAlive()===0){
      B.phase='between';B.t=0;B.score+=50*B.wave;
      P.hp=Math.min(maxHp(),P.hp+2);B.vault=Math.min(B.vaultMax,B.vault+B.regen);
      banner('ONDA '+B.wave+' COMPLETA!','+'+B.regen+' no cofre, vida recuperada',140,'#9fe8a0');sfx('pick');
    }
  }else if(B.phase==='between'){
    if(B.t>230){B.phase='prep';B.t=100;}
  }
}

/* ---------- fundo do título: pôr do sol no deserto (arte original em pixel) ---------- */
let TBG=null;
function titleBG(){
  if(TBG)return TBG;
  const [c,x]=mk(W,H),hz=178;
  const sky=['#241040','#2e1450','#3c1a5a','#4e2266','#642a6e','#7e3472','#9a3e74','#b64c72','#ce5e6c','#e2765e','#f08f58','#f6a85a'];
  const bh=hz/sky.length;
  sky.forEach((col,i)=>rc(x,col,0,Math.floor(i*bh),W,Math.ceil(bh)+1));
  for(let i=0;i<sky.length-1;i++){const y=Math.floor((i+1)*bh);for(let px=0;px<W;px+=2)rc(x,sky[i+1],px+(i%2),y-1,1,1);}
  const R=rr(77);
  for(let k=0;k<30;k++){
    const y=R.i(12,150),len=R.i(24,110),x0=R.i(-30,W);
    const col=y<60?'#5a2c7e':(y<110?'#c0608a':'#f6a07a'),hi=y<60?'#7a44a0':(y<110?'#e48aa0':'#ffc49a');
    rc(x,col,x0,y,len,2);rc(x,hi,x0+5,y-1,Math.max(4,len-12),1);
  }
  /* sol com listras */
  const sx=300,sy=hz-4,sr=40;
  for(let dy=-sr;dy<=0;dy++){
    if(dy>-18&&((dy+40)%5<2))continue;
    const w=Math.floor(Math.sqrt(sr*sr-dy*dy));
    rc(x,dy<-26?'#ffeaa8':(dy<-12?'#fbd878':'#f6be5a'),sx-w,sy+dy,w*2,1);
  }
  rc(x,'#c4687a',0,hz-3,W,3);
  for(let px=0;px<W;px+=2){const h=3+Math.floor(hash(px>>3,9)*6);rc(x,'#7a3e7a',px,hz-h+3,2,h);}
  /* morros (buttes) */
  function butte(cols,base,body,lit,dark,strata){
    cols.forEach(cl=>{
      const [x0,x1,top]=cl;
      for(let px=x0;px<x1;px++){
        const t=(px-x0)/(x1-x0),wob=Math.floor(hash(px,top)*3);
        const yTop=top+wob+(t<0.08||t>0.92?6:0);
        const col=t>0.62?lit:(t<0.22?dark:body);
        rc(x,col,px,yTop,1,base-yTop);
      }
      for(let y=top+10;y<base;y+=9)for(let px=x0;px<x1;px++)if(hash(px,y)>0.35)rc(x,strata,px,y,1,1);
    });
  }
  /* talude */
  for(let px=0;px<220;px++){const yy=hz-30+Math.round(Math.abs(px-105)*0.32)+Math.floor(hash(px,3)*3);rc(x,px>130?'#c86a34':'#9a4a2c',px,yy,1,hz+30-yy);}
  butte([[18,72,46],[76,128,30],[132,146,22],[150,160,58]],hz-8,'#a8482c','#e88040','#6a2a2c','#7e3628');
  for(let px=360;px<480;px++){const yy=hz-14+Math.round(Math.abs(px-430)*0.25);rc(x,'#7e3a52',px,yy,1,hz+20-yy);}
  butte([[392,430,96],[432,458,112]],hz-6,'#8a3e56','#b05a62','#5a2a44','#6a3048');
  /* chão do deserto */
  const gnd=['#f0943c','#e4863a','#d67834','#c86a30','#b65c2c'];
  for(let y=hz;y<H;y++){const k=Math.min(gnd.length-1,Math.floor((y-hz)/((H-hz)/gnd.length)));rc(x,gnd[k],0,y,W,1);}
  for(let i=0;i<220;i++){const px=Math.floor(hash(i,41)*W),py=hz+4+Math.floor(hash(i,42)*(H-hz-4));rc(x,hash(i,43)>0.5?'#f8b060':'#b85a2a',px,py,2,1);}
  for(let i=0;i<26;i++){
    const px=Math.floor(hash(i,51)*W),py=hz+10+Math.floor(hash(i,52)*(H-hz-20)),s2=2+Math.floor(hash(i,53)*4);
    rc(x,'#1e4a40',px-s2,py-s2+1,s2*2,s2);rc(x,'#2e6a52',px-s2+1,py-s2,s2*2-2,s2-1);rc(x,'#4a8a64',px-1,py-s2,2,1);
  }
  /* rochas e cactos no primeiro plano */
  for(let px=0;px<110;px++){const yy=H-18+Math.round(Math.abs(px-30)*0.22);rc(x,'#5a1e30',px,yy,1,H-yy);rc(x,'#7a2e3e',px,yy,1,2);}
  for(let px=380;px<W;px++){const yy=H-22+Math.round(Math.abs(px-450)*0.2);rc(x,'#5a1e30',px,yy,1,H-yy);rc(x,'#7a2e3e',px,yy,1,2);}
  function saguaro(cx,base,h){
    rc(x,'#163a26',cx-4,base-h,8,h);rc(x,'#2a7a4a',cx-3,base-h,5,h);rc(x,'#4aa064',cx-2,base-h+2,1,h-4);
    rc(x,'#163a26',cx-14,base-h*0.55,10,4);rc(x,'#163a26',cx-14,base-h*0.55-14,4,14);rc(x,'#2a7a4a',cx-13,base-h*0.55-13,2,13);
    rc(x,'#163a26',cx+4,base-h*0.7,10,4);rc(x,'#163a26',cx+10,base-h*0.7-12,4,12);rc(x,'#2a7a4a',cx+11,base-h*0.7-11,2,11);
  }
  saguaro(24,H-10,70);saguaro(458,H-12,62);
  TBG=c;return c;
}

function txt(s,x,y,col,size,align,sh){

function bigTxt(s,x,y,size,fill,shadow){
  ctx.font=size+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';
  const o=Math.max(2,Math.round(size/10));
  ctx.fillStyle='#120704';
  for(let dx=-o;dx<=o;dx+=o)for(let dy=-o;dy<=o;dy+=o)ctx.fillText(s,Math.round(x)+dx,Math.round(y)+dy);
  ctx.fillStyle=shadow||'#7a2a10';ctx.fillText(s,Math.round(x)+o,Math.round(y)+o+1);
  ctx.fillStyle=fill;ctx.fillText(s,Math.round(x),Math.round(y));
}
function wrap(s,n){
  const out=[];let line='';
  for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w;}else line=(line+' '+w).trim();}
  if(line)out.push(line);return out;
}

let last=0,acc=0,errShown=false;
function frame(now){
  requestAnimationFrame(frame);
  if(!last)last=now;
  acc+=Math.min(100,now-last);last=now;
  let n=0;
  try{
    while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}
    if(n===5)acc=0;
    render();
  }catch(e){if(!errShown){errShown=true;console.error(e);}}
}

/* =====================================================================
   MODO DIFÍCIL: frenético, brutal e centrado no APARO
   - inimigos agem ~55% mais rápido, atiram com mira preditiva, desviam
   - balas inimigas 40% mais velozes; ~1/3 delas são ROSA (só o aparo as converte em super)
   - cada golpe tira uma carta inteira de vida; invulnerabilidade curta
   - aparo liberado desde o início, janela maior, recarrega munição e enche o SUPER
   ===================================================================== */
const HARD={tempo:0.55,bossTempo:0.3,bulletSpd:1.4,hp:1.4,bossHp:1.25,dmg:2,inv:72,pink:0.34,supMax:3,lead:0.85};
const NO_SCALE={tnt:1,rock:1,cactusO:1,deer:1,ecart:1,wisp:1,torn:1,weed:1,guard:1};
const _mkEn=mkEn;
mkEn=function(d){
  const e=_mkEn(d);
  if(!e||NO_SCALE[e.t])return e;
  const big=e.big||e.t==='boss'||e.t==='briggs'||e.t==='baron'||e.t==='jacky'||e.t==='gghost'||e.t==='brandon';
  const k=big?HARD.bossHp:HARD.hp;
  e.hp*=k;e.max*=k;
  if(e.hr)e.hr*=1.35;
  if(e.t==='bandit'){if(!e.hr)e.hr=250;if(!e.vr)e.vr=90;}
  return e;
};
/* tempo: ticks extras de IA = cadência de tiro, movimentos e padrões mais rápidos */
const TEMPO_T={bandit:1,dyn:1,miner:1,vult:1,gunman:1,raider:1,rdynw:1,thief:1,gren:1,frostgun:1,frostdyn:1,iceb:1,boss:1,brandon:1,baron:1,briggs:1,gghost:1};
const DODGE_T={bandit:1,miner:1,gunman:1,raider:1,frostgun:1,thief:1};
Object.keys(TEMPO_T).forEach(k=>{
  const o=AI[k];if(!o)return;
  AI[k]=function(e){
    o(e);
    if(e.dead||e.st==='dead'||e.st==='wait'||e.st==='intro'||G.state!=='play'||P.dead)return;
    /* inteligência: pula para fora da linha dos tiros do xerife */
    if(DODGE_T[k]){
      if(e.dodgeCd>0)e.dodgeCd--;
      else if(e.onGround){
        for(const b of BUL){
          if(b.own!=='p'||b.dead)continue;
          const dx=e.x-b.x;
          if(Math.abs(dx)<80&&Math.abs(b.y-(e.y-10))<20&&Math.sign(b.vx)===Math.sign(dx)){
            if(Math.random()<0.55){e.vy=-5.4;e.dodgeCd=70;puff(e.x,e.y);}else e.dodgeCd=25;
            break;
          }
        }
      }
    }
    e._ac=(e._ac||0)+((e.big||k==='boss'||k==='briggs'||k==='baron'||k==='brandon'||k==='gghost')?HARD.bossTempo:HARD.tempo);
    if(e._ac>=1){e._ac-=1;o(e);}
  };
});
/* balas: mais rápidas, com mira preditiva e algumas rosas */
function hardenBullet(b){
  if(b.wave)return;
  const sp=Math.hypot(b.vx,b.vy);if(sp<0.1)return;
  if(!b.grav&&!b.pick&&!b.homing){
    const ang=Math.atan2(b.vy,b.vx),dist=Math.hypot(P.x-b.x,(P.y-10)-b.y);
    const direct=Math.atan2((P.y-10)-b.y,P.x-b.x);
    let dd=ang-direct;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;
    const sp2=sp*HARD.bulletSpd;
    if(Math.abs(dd)<0.3&&dist>24){
      const t=dist/sp2;
      const tx=P.x+clamp(P.vx||0,-3,3)*t*HARD.lead,ty=(P.y-10)+(P.onGround?0:clamp(P.vy||0,-4,4)*t*0.35);
      let da=Math.atan2(ty-b.y,tx-b.x)-direct;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
      const na=ang+clamp(da,-0.4,0.4);
      b.vx=Math.cos(na)*sp2;b.vy=Math.sin(na)*sp2;
    }else{b.vx*=HARD.bulletSpd;b.vy*=HARD.bulletSpd;}
  }
  if(!b.snipe&&!b.pick&&(b.life||0)>=40&&Math.random()<HARD.pink){b.pink=true;b.col='#ff6fd8';b.r=Math.max(b.r||2,2.6);}
}

  if(pressed.KeyC&&P&&!P.dead&&!G.flags.cuffed&&(P.sup||0)>=HARD.supMax)doSuper();
  _updB();
};

drawBullets=function(){
  _drawB();
  const pu=0.6+0.4*Math.sin(G.t*0.35);
  for(const b of BUL){

const _hurtP=hurtPlayer;

function addSuper(v){

parryScan=function(){
  const hx=P.x+P.face*9,hy=P.y-14;let got=0,pk=0;
  for(const b of BUL){
    if(b.dead||b.own==='p'||b.wave)continue;

    for(let i=0;i<14;i++){const a=i/14*Math.PI*2;PART.push({x:P.x+Math.cos(a)*10,y:P.y-12+Math.sin(a)*10,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,life:20,max:20,col:pk?'#ff9be8':'#9fe8ff',sz:2,grav:0});}
  }
};
/* SUPER FANTASMA: o saco levanta, o fantasma sai de baixo e solta um raio fantasma */
const SUP_LIFT=24,SUP_BEAM0=26,SUP_BEAM1=86,SUP_END=100,SUP_LEN=560,SUP_HW=14;
function doSuper(){
  P.sup=0;P.superT=1;P.superAng=P.aim||0;P.superLift=0;P.vx=0;P.vy=0;P.parryT=0;P.dashT=0;
  P.inv=Math.max(P.inv,SUP_END+30);G.shake=Math.max(G.shake,4);sfx('aparo');
  banner('','SUPER FANTASMA!',70,'#9fd8ff');
}
function inSuperBeam(x,y,pad){
  const a=P.superAng,ca=Math.cos(a),sa=Math.sin(a),rx=x-P.x,ry=y-(P.y-10);
  const along=rx*ca+ry*sa,perp=-rx*sa+ry*ca;
  return along>-8&&along<SUP_LEN&&Math.abs(perp)<SUP_HW+pad;
}
function superTick(){
  const t=P.superT++;
  P.vx=0;P.vy=0;P.parryT=0;P.inv=Math.max(P.inv,20);
  P.superLift=t<SUP_LIFT?SUP_LIFT*(1-Math.pow(1-t/SUP_LIFT,2)):(t<SUP_BEAM1?SUP_LIFT:SUP_LIFT*Math.max(0,1-(t-SUP_BEAM1)/(SUP_END-SUP_BEAM1)));
  if(t<SUP_BEAM0&&t%3===0)PART.push({x:P.x+rnd(-8,8),y:P.y-4,vx:rnd(-0.4,0.4),vy:rnd(-1.6,-0.6),life:26,max:26,col:t%2?'#9fd8ff':'#ffffff',sz:2,grav:-0.02});
  if(t===SUP_BEAM0){
    G.shake=Math.max(G.shake,12);sfx('boom');sfx('parryhit');
    BUL.forEach(b=>{if(b.own==='e'&&!b.wave){b.dead=true;burst(b.x,b.y,3,['#9fd8ff','#ffffff'],1.6,0,14,2);}});
  }
  if(t>=SUP_BEAM0&&t<SUP_BEAM1){
    G.shake=Math.max(G.shake,5);
    const a=P.superAng,ox=P.x,oy=P.y-10;
    if(t%2===0){
      const d=rnd(20,SUP_LEN),pj=rnd(-SUP_HW,SUP_HW);
      PART.push({x:ox+Math.cos(a)*d-Math.sin(a)*pj,y:oy+Math.sin(a)*d+Math.cos(a)*pj,vx:rnd(-0.5,0.5),vy:rnd(-1.2,-0.2),life:22,max:22,col:Math.random()<0.5?'#9fd8ff':'#ffffff',sz:2,grav:-0.02});
    }
    BUL.forEach(b=>{if(b.own==='e'&&!b.dead&&!b.wave&&inSuperBeam(b.x,b.y,6)){b.dead=true;burst(b.x,b.y,3,['#9fd8ff','#ffffff'],1.6,0,14,2);}});
    if((t-SUP_BEAM0)%5===0){
      for(const e of EN.slice()){
        if(e.dead||e.noHit||e.inv)continue;
        if(e.st==='wait'||e.st==='intro'||e.st==='dead')continue;
        if(!inSuperBeam(e.x,e.y-(e.h||16)/2,(e.h||16)/2))continue;
        if(e.t==='tnt'){e.dead=true;continue;}
        dmgEnemy(e,(e.big||e.t==='boss'||e.bankBoss)?3.2:6,P.x);
        burst(e.x,e.y-(e.h||16)/2,4,['#9fd8ff','#ffffff'],2,0,16,2);
      }
    }
  }
  if(t>=SUP_END){P.superT=0;P.superLift=0;P.inv=Math.max(P.inv,40);}
}
const _updPl=updatePlayer;
updatePlayer=function(){
  if(P.superT>0&&!P.dead){superTick();return;}
  P.superT=0;
  _updPl();
};
function drawSuperBeam(){
  const t=P.superT;
  if(!(t>0)||P.dead)return;
  const k=t<SUP_BEAM0?0:(t<SUP_BEAM0+6?(t-SUP_BEAM0)/6:(t>SUP_BEAM1?Math.max(0,(SUP_END-t)/(SUP_END-SUP_BEAM1)):1));
  if(k<=0)return;
  const a=P.superAng,ox=P.x,oy=P.y-10-P.superLift*0.35,hw=(SUP_HW+Math.sin(G.t*0.8)*2.5)*k;
  ctx.save();ctx.translate(Math.round(ox),Math.round(oy));ctx.rotate(a);ctx.globalCompositeOperation='lighter';
  for(let x=0;x<SUP_LEN;x+=8){
    const w=hw*(1+Math.sin(x*0.07-G.t*0.6)*0.18),fade=1-x/(SUP_LEN*1.6);
    ctx.globalAlpha=0.35*k*fade;ctx.fillStyle='#3a6cff';ctx.fillRect(x,-w*1.5,8,w*3);
    ctx.globalAlpha=0.75*fade;ctx.fillStyle='#8fd0ff';ctx.fillRect(x,-w,8,w*2);
    ctx.globalAlpha=0.95*fade;ctx.fillStyle='#ffffff';ctx.fillRect(x,-w*0.42,8,w*0.84);
  }
  ctx.restore();
  glowAt(ctx,ox,oy,40*k+10,0.7*k);
  ctx.save();ctx.globalAlpha=0.7*k;
  for(let i=0;i<5;i++){
    const d=((G.t*6+i*112)%SUP_LEN),wy=Math.sin(d*0.05+i*2)*hw*0.6;
    drawSpr(S.ghost,ox+Math.cos(a)*d-Math.sin(a)*wy,oy+Math.sin(a)*d+Math.cos(a)*wy+7,Math.cos(a)>=0?1:-1,0.5,0.5,0);
  }
  ctx.restore();
}
function drawSuperPlayer(){
  const t=P.superT,L=P.superLift,f=P.face||1;
  const ga=Math.min(1,t/16)*(t>SUP_BEAM1?Math.max(0,(SUP_END-t)/(SUP_END-SUP_BEAM1)):1);
  glowAt(ctx,P.x,P.y-10,30,0.5*ga);
  ctx.save();ctx.globalAlpha=0.9*ga;
  drawSpr(S.ghost,P.x,P.y-L*0.35+Math.sin(t*0.3)*1.2,f,1,1,0);
  ctx.restore();
  ctx.save();ctx.globalAlpha=1;
  const shk=t<SUP_LIFT?rnd(-0.8,0.8):0;
  drawSpr(S.player,P.x+shk,P.y-L,f,1,1,Math.sin(t*0.5)*0.05);
  ctx.restore();
}
const _dPlS=drawPlayer;
drawPlayer=function(){if(P.superT>0&&!P.dead)drawSuperPlayer();else _dPlS();};
const _drawB2=drawBullets;
drawBullets=function(){_drawB2();drawSuperBeam();};
/* HUD do super */
const _dPH=drawParryHUD;
drawParryHUD=function(){
  _dPH();
  if(!P||G.flags.cuffed)return;
  const x=34,y=H-72,s=P.sup||0,rdy=s>=HARD.supMax,pu=rdy?0.6+0.4*Math.sin(G.t*0.3):1;
  for(let i=0;i<HARD.supMax;i++){
    const f=clamp(s-i,0,1);
    rc(ctx,'#000',x+i*14-1,y-1,13,22);rc(ctx,'#2a1a2a',x+i*14,y,11,20);
    if(f>0){ctx.globalAlpha=pu;rc(ctx,rdy?'#bfe8ff':'#7fb8ff',x+i*14,y+20-Math.round(20*f),11,Math.round(20*f));ctx.globalAlpha=1;}
  }
  if(rdy)txt('SUPER FANTASMA [C]',x,y-10,'#9fd8ff',8);
  else if(!TOUCH.on)txt('C',x+HARD.supMax*14-6,y-10,'#9fd8ff',8);
};
TBTN.push({id:'super',x:W-196,y:H-124,r:20,label:'FANT.',key:'KeyC',cond:()=>!!P&&(P.sup||0)>=HARD.supMax&&!G.flags.cuffed});
const _dHUD=drawHUD;
drawHUD=function(){_dHUD();if(!R.cartMode&&!PVP)drawParryHUD();};
/* dica inicial */
const _updH=update;
update=function(){
  _updH();
  if(G.state==='play'&&!G.hardTip&&P&&!G.fade){G.hardTip=true;banner('MODO DIFÍCIL','Aparo (L) em tiros ROSA enche o SUPER FANTASMA [C]',300,'#ff9be8');}
};

G.hasSave=!!loadSave();G.state='splash';
fit();
try{if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"');}catch(e){}
requestAnimationFrame(frame);
if(window.__OW_TEST)window.__OW_TEST.api={G,update,render,enterRoom,get P(){return P;},set P(v){P=v;},get R(){return R;},get EN(){return EN;},get BUL(){return BUL;},startNew,keys,pressed,mouse,ROOMS,BAG,REV,S,newPlayer,beginPlay,Mus,getTrack,TDEF,startTrack,musicTick,get PK(){return PK;},get CART(){return CART;},mkEn,spawnPK,get RESP(){return RESP;},get ALERT(){return ALERT;},roomTrack,killEnemy,startParry,hurtPlayer,get STORM(){return STORM;},get EMB(){return EMB;},dropDbl,WP,GUN,get ESC(){return ESC;},openWheel,get HUNT(){return HUNT;},startBank,openWardrobe,wdRows,wdEquip,bankWaveList,startMineOffer,HATS,SKINS,applyOutfit,gunImg,playerGun,recolorGun,mazeLayout,MZ_T,startBriggsAmbush,briggsDeath,bankSpawn,get TRACKS(){return TRACKS;},BLOOD,snowTint,deerHit,get PART(){return PART;},iceHit,jumpIntoSnow,DEER_WP,MT_X,MT_ROW,get AMB(){return AMB;},cam,NET,get PVP(){return PVP;},netJoin,processPeer,jackyDeath,TOUCH,openShop,buy,openTravel,travelTo,openCamp,MPOS,RDIM,get ST(){return ST;},UPS,tearCards,cycleAmmo,dropLoot,spawnPK,CARDS,get cards(){return G.cards;}};
})();
